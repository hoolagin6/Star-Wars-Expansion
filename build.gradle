plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '3.1.0'
group = 'com.fazbrick.starwarsexpansion'

base {
    archivesName = 'StarWarsExpansion'
}

neoForge {
    version = '21.1.264'

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run')
        }
    }

    mods {
        star_wars_expansion {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
}

dependencies {
    implementation files('libs/geckolib-neoforge-1.21.1-4.6.6.jar')
    implementation files('libs/PlayerAnimationLibNeoforge-1.1.6+mc.1.21.1.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
